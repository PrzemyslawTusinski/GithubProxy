spring.application.name=github-proxy

# GitHub API client; every value can be overridden by an environment variable (see README)
github.base-url=https://api.github.com
github.token=
github.page-size=100
github.max-concurrency=10
github.request-timeout=30s

# HTTP client used for GitHub (the codec limit fits a page of 100 repositories with all fields)
spring.http.reactiveclient.connect-timeout=5s
spring.http.reactiveclient.read-timeout=10s
spring.http.reactiveclient.redirects=dont-follow
spring.http.codecs.max-in-memory-size=10MB

management.endpoints.web.exposure.include=health
