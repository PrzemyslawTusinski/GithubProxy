spring.application.name=github-proxy

# GitHub API client (see README for the matching environment variables)
github.api.base-url=${GITHUB_API_BASE_URL:https://api.github.com}
github.token=${GITHUB_TOKEN:}
github.connect-timeout=${GITHUB_CONNECT_TIMEOUT:5s}
github.read-timeout=${GITHUB_READ_TIMEOUT:10s}
github.page-size=${GITHUB_PAGE_SIZE:100}
github.max-concurrency=${GITHUB_MAX_CONCURRENCY:10}

management.endpoints.web.exposure.include=health
