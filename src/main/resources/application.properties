spring.application.name=github-proxy

github.base-url=https://api.github.com

spring.http.reactiveclient.connect-timeout=5s
spring.http.reactiveclient.read-timeout=10s
# The token must never be re-sent to wherever a Location header points.
spring.http.reactiveclient.redirects=dont-follow
# A page of 100 repositories with all GitHub fields is above WebClient's 256 KB default.
spring.http.codecs.max-in-memory-size=10MB
